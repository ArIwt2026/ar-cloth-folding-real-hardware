# Canonical calibration export for simulation.
# All transforms are parent -> child.
# Translation: metres. Quaternion: x, y, z, w.

version: 1
source: ../static_publishers.launch.py
world_frame: world
world_definition: frozen table AprilTag snapshot
anchor_frame: lucid_triton_color_optical_frame
table_dimensions_m: [0.70, 1.20]
table_negative_x_extent_m: 0.70
ground_reference:
  height_z_m: -0.890
  note: current KUKA tag Z height in world frame, used as ground reference

table_origin_measurements:
  - name: kuka_d455_tag24_current_world_position
    parent: world
    child: kuka_d455_tag24
    translation_xyz_m: [0.106, 0.511, 0.018]
    note: current XYZ measurement expressed in world frame; tag is placed at the table origin

transforms:
  - name: panda_d455_handeye_tf
    parent: panda_link8
    child: panda_d455_link
    translation_xyz_m: [0.05006900349042004, 0.015266267172393305, 0.07409719296917006]
    quaternion_xyzw: [-0.26623178107864587, -0.6453999784702183, -0.2837929078727779, 0.6572983279877153]

  - name: world_to_triton_snapshot
    parent: world
    child: lucid_triton_color_optical_frame
    translation_xyz_m: [0.48742056, -0.02957435, 0.76378568]
    quaternion_xyzw: [0.66195830, 0.60796170, -0.30698066, -0.31298028]
    note: frozen table-tag snapshot; current temporary world reference

  - name: triton_to_kuka_base_calibration
    parent: lucid_triton_color_optical_frame
    child: iiwa7_link_0
    translation_xyz_m: [0.85142967, 0.10649739, 1.18792187]
    quaternion_xyzw: [0.03935360, 0.87338426, -0.48511301, -0.01779319]
    source_calibration: ~/.ros2/easy_handeye2/calibrations/kuka_lucid_eye_on_base_20260925.calib
    method: Tsai-Lenz
    sample_count: 10
    calibrated_transform: iiwa7_link_0 -> lucid_triton_color_optical_frame

  - name: triton_to_panda_base_calibration
    parent: lucid_triton_color_optical_frame
    child: panda_link0
    translation_xyz_m: [-0.30228667, -0.17465263, 1.47430243]
    quaternion_xyzw: [0.64720492, 0.62833202, -0.32084623, 0.28876004]

  - name: kuka_d455_handeye_tf
    parent: iiwa7_link_ee
    child: kuka_d455_link
    translation_xyz_m: [-0.062337038479209, -0.002079446160069, 0.054833116964160]
    quaternion_xyzw: [0.662151348834694, -0.266749091542836, 0.647009070900363, 0.267917479030610]

  - name: triton_to_helios_calibration
    parent: lucid_triton_color_optical_frame
    child: lucid_helios_depth_optical_frame
    translation_xyz_m: [0.0000009951439060323613, 0.05077449722769215, 0.00559786378091818]
    quaternion_xyzw: [-0.0011389760097307374, 0.006276698810241969, 0.0002837177313983205, 0.9999796124371455]
    source: ../lucid_cameras/docker/publish_calibration.py
    source_rotation_vector: [-0.0022779675002177128, 0.012553482932240666, 0.00056743931903681]
    source_translation_mm: [0.0009951439060323613, 50.77449722769215, 5.59786378091818]

camera_driver_transforms:
  - parent: kuka_d455_link
    child: kuka_d455_color_optical_frame
    source: RealSense driver
  - parent: panda_d455_link
    child: panda_d455_color_optical_frame
    source: RealSense driver
